name: publish

# Push to main → if package.json's version is newer than what's on npm,
# publish it. No-op if the version hasn't changed (so day-to-day commits
# don't republish). The npm registry rejects re-publishing the same
# version anyway, but we short-circuit so the run reports green.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read versions
        id: ver
        run: |
          set -euo pipefail
          LOCAL=$(node -e "console.log(require('./package.json').version)")
          REMOTE=$(curl -fsSL "https://registry.npmjs.org/terminalwatch/latest" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).version)}catch{console.log('0.0.0')}})") || REMOTE="0.0.0"
          echo "local=$LOCAL"   >> "$GITHUB_OUTPUT"
          echo "remote=$REMOTE" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "local=$LOCAL  remote=$REMOTE"

      - name: Install dependencies
        if: steps.ver.outputs.publish == 'yes'
        run: bun install --frozen-lockfile

      - name: Configure npm auth
        if: steps.ver.outputs.publish == 'yes'
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: steps.ver.outputs.publish == 'yes'
        run: bun publish --access public

      - name: Summary
        run: |
          {
            echo "## twatch publish"
            echo ""
            echo "- local  version: \`${{ steps.ver.outputs.local }}\`"
            echo "- npm    version: \`${{ steps.ver.outputs.remote }}\`"
            echo "- result: \`${{ steps.ver.outputs.publish == 'yes' && 'published' || 'skipped (version unchanged)' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
